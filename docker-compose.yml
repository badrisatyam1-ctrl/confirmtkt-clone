version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: travelbooking-db
    restart: always
    environment:
      POSTGRES_USER: traveluser
      POSTGRES_PASSWORD: travelpassword
      POSTGRES_DB: travelbooking
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traveluser -d travelbooking"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travelbooking-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://traveluser:travelpassword@postgres:5432/travelbooking?schema=public
      - JWT_ACCESS_SECRET=your_super_secret_access_key
      - JWT_REFRESH_SECRET=your_super_secret_refresh_key
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - STRIPE_SECRET_KEY=sk_test_mock
      - GOOGLE_CLIENT_ID=mock_client_id
      # - RESEND_API_KEY=mock_key
    ports:
      - "5000:5000"

  # React Frontend App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: travelbooking-ui
    restart: always
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1
    depends_on:
      - backend

volumes:
  postgres-data:
